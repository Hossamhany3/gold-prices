<!DOCTYPE html>

<head>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="اسعار الذهب">
    <meta name="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script>
    if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
    </script>
    <style>
        :root{--bg1:#0a0a1a;--bg2:#141432;--bg3:#1a1a3e;--card:rgba(255,255,255,.05);--card2:rgba(255,255,255,.03);--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.12);--txt:#f0f0f5;--txt2:#c8c8d8;--txt3:#9999b3;--txt4:#6e6e8a;--gold:#ffd700;--gold2:#ff8c00;--gold3:rgba(255,215,0,.08);--silver:#c0c0c0;--cyan:#00bcd4;--green:#00e676;--red:#ff5252;--orange:#ffab00}
        [data-theme="light"]{--bg1:#f5f6fa;--bg2:#eaecf2;--bg3:#e0e3ea;--card:rgba(255,255,255,.85);--card2:rgba(255,255,255,.6);--border:rgba(0,0,0,.07);--border2:rgba(0,0,0,.1);--txt:#1a1a2e;--txt2:#2d2d44;--txt3:#555570;--txt4:#8888a0;--gold:#b8860b;--gold2:#cc7000;--gold3:rgba(184,134,11,.06);--silver:#777;--cyan:#00838f;--green:#00875a;--red:#d32f2f;--orange:#e65100}
        [data-theme="gold"]{--bg1:#1a1400;--bg2:#2a2000;--bg3:#3a2d00;--card:rgba(255,215,0,.06);--card2:rgba(255,215,0,.03);--border:rgba(255,215,0,.12);--border2:rgba(255,215,0,.2);--txt:#fff8e1;--txt2:#ffe082;--txt3:#bfa44a;--txt4:#8a7530;--gold:#ffd700;--gold2:#ff8c00;--gold3:rgba(255,215,0,.1);--silver:#c0c0c0;--cyan:#00bcd4;--green:#00e676;--red:#ff5252;--orange:#ffab00}
        [data-theme="oceanic"]{--bg1:#0a1628;--bg2:#0d1f3c;--bg3:#102a50;--card:rgba(0,188,212,.06);--card2:rgba(0,188,212,.03);--border:rgba(0,188,212,.12);--border2:rgba(0,188,212,.2);--txt:#e0f7fa;--txt2:#80deea;--txt3:#4dd0e1;--txt4:#00838f;--gold:#ffd700;--gold2:#ff8c00;--gold3:rgba(255,215,0,.08);--silver:#b0bec5;--cyan:#00bcd4;--green:#00e676;--red:#ff5252;--orange:#ffab00}
        [data-theme="midnight"]{--bg1:#0d0221;--bg2:#150538;--bg3:#1a0740;--card:rgba(156,39,176,.06);--card2:rgba(156,39,176,.03);--border:rgba(156,39,176,.15);--border2:rgba(156,39,176,.25);--txt:#f3e5f5;--txt2:#ce93d8;--txt3:#ab47bc;--txt4:#7b1fa2;--gold:#ffd700;--gold2:#ff8c00;--gold3:rgba(255,215,0,.08);--silver:#b0bec5;--cyan:#00bcd4;--green:#00e676;--red:#ff5252;--orange:#ffab00}
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        html{height:100%;-webkit-text-size-adjust:100%;overscroll-behavior:none}
        body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));color:var(--txt);min-height:100%;min-height:100dvh;transition:background .3s,color .3s;line-height:1.5;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
        .header{text-align:center;padding:18px 16px 14px;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,.15) 100%);border-bottom:2px solid var(--gold);backdrop-filter:blur(10px)}
        [data-theme="light"] .header{background:linear-gradient(180deg,rgba(255,255,255,.8) 0%,rgba(255,255,255,.5) 100%);border-bottom-color:var(--gold)}
        .header h1{font-size:1.6rem;background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-.5px}
        .header p{color:var(--txt3);margin-top:4px;font-size:.8rem}
        .status{display:flex;justify-content:center;gap:12px;margin-top:8px;flex-wrap:wrap;font-size:.72rem;color:var(--txt3);align-items:center}
        .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-left:5px;animation:pulse 1.5s infinite}
        .dot.ok{background:var(--green)}.dot.err{background:var(--red);animation:none}.dot.ld{background:var(--orange)}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
        .topbar{display:flex;justify-content:center;align-items:center;gap:8px;padding:8px 16px;background:rgba(0,0,0,.2);flex-wrap:wrap}
        [data-theme="light"] .topbar{background:rgba(0,0,0,.03)}
        .top-btn{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:5px 12px;color:var(--txt2);cursor:pointer;font-size:.78rem;transition:.2s;font-family:inherit}
        .top-btn:hover{background:var(--gold);color:#000;border-color:var(--gold)}
        .top-btn.on{background:var(--gold);color:#000;border-color:var(--gold)}
        .ctn{max-width:1400px;margin:0 auto;padding:14px}
        .tabs{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap;justify-content:center}
        .tab{padding:7px 16px;background:var(--card);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:.25s;font-size:.82rem;color:var(--txt3);font-family:inherit;white-space:nowrap}
        .tab:hover{background:var(--gold3);color:var(--gold);border-color:rgba(255,215,0,.2)}
        .tab.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;font-weight:bold;border-color:var(--gold);box-shadow:0 2px 12px rgba(255,215,0,.25)}
        .sec{display:none}.sec.on{display:block}
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:16px}
        .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;transition:.2s;backdrop-filter:blur(6px)}
        .card:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(255,215,0,.08);border-color:var(--border2)}
        [data-theme="light"] .card:hover{box-shadow:0 6px 20px rgba(0,0,0,.06)}
        .ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
        .ct2{font-size:.95rem;font-weight:600}
        .badge{padding:3px 9px;border-radius:12px;font-size:.65rem;font-weight:bold;letter-spacing:.3px}
        .bg{background:var(--gold);color:#000}.bs{background:var(--silver);color:#000}.bc{background:var(--cyan);color:#000}
        .pr{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);align-items:center}
        .pr:last-child{border-bottom:none}
        .pl{color:var(--txt3);font-size:.8rem}.pv{font-weight:bold;font-size:.9rem}
        .pegp{color:var(--gold)}.pint{color:var(--cyan)}
        .cu{color:var(--green)}.cd{color:var(--red)}.cn{color:var(--orange)}
        .cc{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
        .cc h3{margin-bottom:12px;color:var(--gold);font-size:.9rem}
        .cw{position:relative;height:300px}
        .sc{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-bottom:16px}
        .scd{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
        .sv{font-size:1.3rem;font-weight:bold;margin:4px 0}
        .sl{font-size:.7rem;color:var(--txt3)}
        .rbtn{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;border:none;padding:7px 18px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:.82rem;transition:.2s;font-family:inherit}
        .rbtn:hover{transform:scale(1.03);box-shadow:0 2px 10px rgba(255,215,0,.3)}.rbtn:disabled{opacity:.5;cursor:not-allowed}
        .ctrl{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
        .ctrl h2{font-size:1.1rem}
        .atag{display:inline-block;padding:2px 7px;border-radius:6px;font-size:.6rem;background:rgba(0,230,118,.12);color:var(--green);border:1px solid rgba(0,230,118,.25)}
        .pcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
        .ph{display:flex;align-items:center;gap:10px;margin-bottom:8px}
        .av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:bold;color:#000}
        .pn{font-weight:600}.pt{font-size:.7rem;color:var(--txt3)}
        .ptx{line-height:1.6;color:var(--txt2);font-size:.84rem}
        .ptag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.68rem;font-weight:bold;margin-top:6px}
        .tb{background:rgba(0,230,118,.12);color:var(--green);border:1px solid rgba(0,230,118,.3)}
        .tbr{background:rgba(255,82,82,.12);color:var(--red);border:1px solid rgba(255,82,82,.3)}
        .tbn{background:rgba(255,171,0,.12);color:var(--orange);border:1px solid rgba(255,171,0,.3)}
        .err{background:rgba(255,82,82,.08);border:1px solid rgba(255,82,82,.3);border-radius:10px;padding:12px;margin-bottom:12px;color:#ff8a80;text-align:center;font-size:.88rem}
        [data-theme="light"] .err{color:var(--red)}
        .ni{padding:10px;border-bottom:1px solid var(--border)}
        .nt{font-size:.68rem;color:var(--txt4)}
        .ih{background:rgba(255,82,82,.15);color:var(--red);padding:2px 7px;border-radius:8px;font-size:.62rem}
        .im{background:rgba(255,171,0,.15);color:var(--orange);padding:2px 7px;border-radius:8px;font-size:.62rem}
        .calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
        .calc-input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--txt);font-size:.95rem;text-align:center;font-family:inherit}
        .calc-input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,215,0,.15)}
        .calc-label{display:block;margin-bottom:5px;color:var(--txt3);font-size:.82rem}
        .calc-select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--txt);font-size:.95rem;text-align:center;cursor:pointer;font-family:inherit}
        .calc-result{background:linear-gradient(135deg,rgba(255,215,0,.06),rgba(255,140,0,.06));border:1px solid rgba(255,215,0,.2);border-radius:12px;padding:16px;text-align:center}
        .calc-result .big{font-size:1.8rem;font-weight:bold;color:var(--gold)}
        .alert-item{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid var(--border)}
        .alert-item:last-child{border-bottom:none}
        .alert-del{background:var(--red);color:#fff;border:none;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:.72rem;font-family:inherit}
        .alert-add{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
        .alert-add input,.alert-add select{padding:7px;border-radius:6px;border:1px solid var(--border);background:var(--card2);color:var(--txt);font-size:.82rem;font-family:inherit}
        .alert-add input{flex:1;min-width:90px}
        .alert-add select{min-width:110px}
        .export-btn{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:5px 12px;color:var(--txt2);cursor:pointer;font-size:.78rem;transition:.2s;font-family:inherit}
        .export-btn:hover{background:var(--gold);color:#000;border-color:var(--gold)}
        .countdown{color:var(--orange);font-weight:600;font-size:.72rem}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#000;padding:8px 20px;border-radius:8px;font-weight:bold;font-size:.85rem;z-index:9999;animation:toastIn .3s ease,toastOut .3s ease 2.7s forwards;pointer-events:none}
        @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(16px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
        @keyframes toastOut{from{opacity:1}to{opacity:0}}
        @media print{
            body{background:#fff!important;color:#000!important}
            .header{background:none!important;border-bottom:2px solid #000!important;padding:8px!important}
            .header h1{background:none!important;-webkit-text-fill-color:#000!important;font-size:1.2rem!important}
            .header p,.status,.dot,#apiSt{color:#333!important}
            .topbar,.tabs,.ctrl .rbtn,.ctrl .export-btn,.top-btn,#errBox{display:none!important}
            .card,.cc,.scd{background:none!important;border:1px solid #ccc!important;box-shadow:none!important;transform:none!important}
            .card:hover{transform:none!important;box-shadow:none!important}
            .sv,.pv,.ct2,.pn{color:#000!important}
            .pl,.sl,.pt,.nt,.txt3,.txt4{color:#555!important}
            .pegp{color:#333!important}
            .pint{color:#000!important}
            .badge{border:1px solid #999!important}
            .cc h3{color:#000!important}
            .cmp-table th{background:#f0f0f0!important;color:#000!important}
            .cmp-table td{color:#333!important}
            .grid{grid-template-columns:repeat(3,1fr)!important}
            .cw{height:180px!important}
            .sc{grid-template-columns:repeat(4,1fr)!important}
            .date-bar{display:none!important}
        }
        .date-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
        .date-bar label{display:block;margin-bottom:3px;color:var(--txt3);font-size:.78rem}
        .date-bar input[type="date"]{padding:7px 10px;border-radius:6px;border:1px solid var(--border);background:var(--card2);color:var(--txt);font-size:.82rem;font-family:inherit}
        .date-bar input[type="date"]:focus{outline:none;border-color:var(--gold)}
        .date-presets{display:flex;gap:5px;flex-wrap:wrap}
        .preset-btn{padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--txt3);cursor:pointer;font-size:.75rem;transition:.2s;font-family:inherit}
        .preset-btn:hover{background:var(--gold);color:#000;border-color:var(--gold)}
        .preset-btn.on{background:var(--gold);color:#000;font-weight:bold;border-color:var(--gold)}
        .cmp-table{width:100%;border-collapse:collapse;margin-bottom:14px}
        .cmp-table th,.cmp-table td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--border);font-size:.82rem}
        .cmp-table th{background:var(--gold3);color:var(--gold);font-weight:600;font-size:.76rem}
        .cmp-table td{color:var(--txt2)}
        .cmp-table tr:hover td{background:rgba(255,255,255,.02)}
        [data-theme="light"] .cmp-table tr:hover td{background:rgba(0,0,0,.02)}
        .cmp-up{color:var(--green);background:rgba(0,230,118,.08);padding:2px 6px;border-radius:4px;font-weight:600}
        .cmp-down{color:var(--red);background:rgba(255,82,82,.08);padding:2px 6px;border-radius:4px;font-weight:600}
        .cmp-flat{color:var(--txt4);background:rgba(128,128,128,.05);padding:2px 6px;border-radius:4px}
        .cmp-loading{text-align:center;padding:30px;color:var(--txt3)}
        .settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
        .settings-group{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
        .settings-group h3{color:var(--gold);margin-bottom:12px;font-size:.9rem}
        .settings-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
        .settings-row:last-child{border-bottom:none}
        .settings-row label{color:var(--txt3);font-size:.82rem}
        .settings-input{width:72px;padding:6px;border-radius:6px;border:1px solid var(--border);background:var(--card2);color:var(--txt);font-size:.85rem;text-align:center;font-family:inherit}
        .settings-input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,215,0,.15)}
        .settings-hint{font-size:.68rem;color:var(--txt4);margin-top:3px}
        .settings-default{background:rgba(255,215,0,.1);color:var(--gold);border:1px solid rgba(255,215,0,.3);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:.78rem;font-weight:600;transition:.2s;font-family:inherit}
        .settings-default:hover{background:var(--gold);color:#000}
        @media(max-width:768px){.header h1{font-size:1.2rem}.grid{grid-template-columns:1fr}.cw{height:220px}.calc-grid{grid-template-columns:1fr}.cmp-table{font-size:.72rem}.cmp-table th,.cmp-table td{padding:5px 3px}.settings-grid{grid-template-columns:1fr!important}.sc{grid-template-columns:repeat(2,1fr)!important}.tabs{gap:4px}.tab{padding:6px 10px;font-size:.75rem}.topbar{gap:5px}.top-btn{padding:4px 8px;font-size:.72rem}}
        @media(max-width:480px){.sc{grid-template-columns:1fr 1fr!important}.sv{font-size:1.1rem}.header h1{font-size:1.05rem}.tabs{gap:3px;justify-content:center}.tabs .tl{display:none}.tab{padding:6px 8px;font-size:1rem}}
        #splash{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#0a0a1a,#141432,#1a1a3e);z-index:99999;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:opacity .5s}
        #splash.hide{opacity:0;pointer-events:none}
        #splash h1{font-size:2rem;background:linear-gradient(90deg,#ffd700,#ff8c00,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px}
        #splash p{color:#999;font-size:.9rem}
        #splash .loader{width:40px;height:40px;border:3px solid rgba(255,215,0,.2);border-top:3px solid #ffd700;border-radius:50%;animation:spin .8s linear infinite;margin-top:20px}
        @keyframes spin{to{transform:rotate(360deg)}}
        #installBanner{display:none;position:fixed;bottom:0;left:0;right:0;background:linear-gradient(135deg,#1a1a3e,#0a0a1a);border-top:2px solid var(--gold);padding:12px 16px;z-index:9990;justify-content:space-between;align-items:center}
        #installBanner.show{display:flex}
        .chat-msg{margin-bottom:10px}
    </style>
</head>
<body>

<div id="splash"><h1>🪙 اسعار الذهب</h1><p>مقارنة اسعار الذهب والفضة والعملات</p><div class="loader"></div></div>
<div id="installBanner"><span style="color:var(--gold);font-weight:bold">📲 تثبيت التطبيق</span><button class="rbtn" id="installBtn">تثبيت</button><button class="top-btn" onclick="dismissInstall()" style="color:var(--txt4)">✕</button></div>

<div class="header">
    <h1>مقارنة اسعار الذهب والفضة والعملات</h1>
    <p>بيانات حية مباشرة من سوق العملات العالمي</p>
    <div class="status">
        <span><span class="dot ld" id="dot"></span> <span id="upd">جاري التحميل...</span></span>
        <span id="apiSt"></span>
        <span id="egyptSt"></span>
        <span class="countdown" id="countdown"></span>
    </div>
    <div id="pinnedBar" style="display:none;margin-top:10px;padding:6px 12px;background:rgba(255,215,0,.08);border:1px solid rgba(255,215,0,.2);border-radius:10px;font-size:.75rem;display:flex;gap:12px;flex-wrap:wrap;justify-content:center"></div>
</div>
<div class="topbar">
    <input type="search" id="searchBox" placeholder="🔍 بحث عن صنف..." style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:5px 10px;color:var(--txt);font-size:.78rem;width:140px;font-family:inherit" oninput="handleSearch(this.value)">
    <button class="top-btn" onclick="toggleTheme()" id="themeBtn">☀️ وضع مضيء</button>
    <button class="top-btn" onclick="toggleSound()" id="soundBtn">🔇 صوت التنبيهات</button>
    <button class="top-btn" onclick="sharePrice()">📤 مشاركة</button>
    <button class="top-btn" onclick="exportPDF()">📄 تقرير PDF</button>
    <button class="top-btn" onclick="exportCSV()">📥 تصدير CSV</button>
</div>

<div class="ctn">
    <div class="tabs" id="tabs" role="tablist" aria-label="التبويبات"></div>
    <div id="errBox" role="alert"></div>
    <div id="content" role="main" aria-live="polite"></div>
</div>

<script>
const TABS=[
    {id:'gold',label:'الذهب',icon:'🥇'},
    {id:'silver',label:'الفضة',icon:'🥈'},
    {id:'currency',label:'العملات',icon:'💵'},

async function fetchData(){
    document.getElementById('dot').className='dot ld';
    try{
        const url='https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json?_='+(Date.now());

        R=data.usd;

async function fetchEgyptPrices(){
    try{

            EGYPT=data.prices;

async function fetchHistory(){
    if(Object.keys(HIST).length>0)return;
    const today=new Date();
    const dates=[];
    for(let i=7;i>=0;i--){
        const d=new Date(today);d.setDate(d.getDate()-i);
        dates.push(d.toISOString().split('T')[0]);
    }
    try{
        const promises=dates.map(async d=>{
            try{
                const r=await fetch(`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${d}/v1/currencies/usd.json`);
                const data=await r.json();
                HIST[d]=data.usd||null;
            }catch(e){HIST[d]=null;}
        });
        await Promise.all(promises);
    }catch(e){}
}

function rates(){
    if(!R)return null;
    const ue=R.egp,go=1/R.xau,so=1/R.xag;
    return{
        usd:ue,gold:{oz:go,ozE:go*ue,gr:go/31.1035,grE:go/31.1035*ue},
        silver:{oz:so,ozE:so*ue,gr:so/31.1035,grE:so/31.1035*ue},
        ratio:go/so
    };
}

function drawHistChart(){
    if(!R)return;
    const r=rates();
    const entries=[];
    for(const[d,usd]of Object.entries(HIST)){
        if(!usd||!usd.xau||!usd.xag)continue;
        entries.push({d,gold:+(1/usd.xau).toFixed(2),silver:+(1/usd.xag).toFixed(2)});
    }
    entries.sort((a,b)=>a.d.localeCompare(b.d));
    const labels=entries.map(e=>e.d),goldData=entries.map(e=>e.gold),silverData=entries.map(e=>e.silver);

async function compareDates(){
    const d1=document.getElementById('dateFrom').value;
    const d2=document.getElementById('dateTo').value;
    if(!d1||!d2){return;}
    if(d1>d2){alert('التاريخ الأول لازم يكون قبل الثاني');return;}
    const res=document.getElementById('cmpResult');
    res.innerHTML='<div class="cmp-loading">⏳ جاري تحميل البيانات التاريخية...</div>';

    const allDates=[];
    let cur=new Date(d1);
    const end=new Date(d2);
    while(cur<=end){
        allDates.push(cur.toISOString().split('T')[0]);
        cur.setDate(cur.getDate()+1);
    }
    if(allDates.length>60){res.innerHTML='<div class="cmp-loading">❌ الحد الأقصى 60 يوم. اختصر المدة.</div>';return;}

    try{
        const results={};
        const promises=allDates.map(async d=>{
            try{
                const r=await fetch(`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${d}/v1/currencies/usd.json`);
                const data=await r.json();
                results[d]=data.usd||null;
            }catch(e){results[d]=null;}
        });
        await Promise.all(promises);
        const data=results;
        const P=PREMIUMS,SP=SPREAD;

        function extract(usd){
            if(!usd||!usd.xau||!usd.xag||!usd.egp)return null;
            const gold=1/usd.xau,silver=1/usd.xag,ue=usd.egp;
            const goldGr=gold/31.1035*ue;
            const halfG=SP.gold/2,halfS=SP.silver/2;
            return{
                goldOz:gold,goldGr:goldGr,
                gold24s:goldGr*(1+P.g24/100)*(1+halfG/100),gold24b:goldGr*(1+P.g24/100)*(1-halfG/100),
                gold21s:goldGr*(1+P.g24/100)*21/24*(1+halfG/100),gold21b:goldGr*(1+P.g24/100)*21/24*(1-halfG/100),
                silverOz:silver,silverGr:silver/31.1035*ue,
                silver999s:silver/31.1035*ue*(1+P.s999/100)*(1+halfS/100),
                silver999b:silver/31.1035*ue*(1+P.s999/100)*(1-halfS/100),
                usd:ue,eur:ue/usd.eur,gbp:ue/usd.gbp,sar:ue/usd.sar
            };
        }

        const days=[];
        allDates.forEach(d=>{
            const raw=data[d];
            const ext=extract(raw);
            if(ext)days.push({date:d,...ext});
        });

        if(days.length<2){res.innerHTML='<div class="cmp-loading">❌ لا توجد بيانات كافية في هذا النطاق. جرّب تواريخ أقرب.</div>';return;}

        const first=days[0],last=days[days.length-1];

        function pct(a,b){return((b-a)/a*100);}
        function chgCell(v){
            if(isNaN(v)||!isFinite(v))return'<td class="cmp-flat">---</td>';
            const cls=v>0.01?'cmp-up':v<-0.01?'cmp-down':'cmp-flat';
            const arrow=v>0.01?'▲':v<-0.01?'▼':'—';
            return`<td class="${cls}">${arrow} ${Math.abs(v).toFixed(2)}%</td>`;
        }

        let summary=`<div class="cc"><h3>📊 ملخص المقارنة: ${d1} ← ${d2} (${days.length} يوم)</h3>
        <div style="overflow-x:auto"><table class="cmp-table">
        <tr><th>البند</th><th>السعر (${d1})</th><th>السعر (${d2})</th><th>التغيير الكلي</th></tr>`;
        const summaryRows=[
            ['🥇 ذهب اونصة $',first.goldOz,last.goldOz],
            ['🥇 ذهب 24K بيع ج.م',first.gold24s,last.gold24s],
            ['🥇 ذهب 24K شراء ج.م',first.gold24b,last.gold24b],
            ['🥇 ذهب 21K بيع ج.م',first.gold21s,last.gold21s],
            ['🥇 ذهب 21K شراء ج.م',first.gold21b,last.gold21b],
            ['🥈 فضة 999 بيع ج.م',first.silver999s,last.silver999s],
            ['🥈 فضة 999 شراء ج.م',first.silver999b,last.silver999b],
            ['💵 دولار ج.م',first.usd,last.usd],
            ['🇪🇺 يورو ج.م',first.eur,last.eur],
            ['🇸🇦 ريال سعودي ج.م',first.sar,last.sar]
        ];
        summaryRows.forEach(([label,a,b])=>{
            const dec=label.includes('ونصة')||label.includes('$')?2:0;
            summary+=`<tr><td style="text-align:right;font-weight:bold">${label}</td><td>${fmt(a,dec)}</td><td>${fmt(b,dec)}</td>${chgCell(pct(a,b))}</tr>`;
        });
        summary+=`</table></div></div>`;

        let daily=`<div class="cc"><h3>📅 تفاصيل يوم بيوم</h3>
        <div style="overflow-x:auto"><table class="cmp-table">
        <tr><th>التاريخ</th><th>ذهب $/oz</th><th>24K بيع</th><th>24K شراء</th><th>21K بيع</th><th>21K شراء</th><th>فضة بيع</th><th>فضة شراء</th><th>دولار</th></tr>`;
        days.forEach((d,i)=>{
            const prev=i>0?days[i-1]:null;
            const dayChg=prev?pct(prev.goldOz,d.goldOz):0;
            const cls=dayChg>0.01?'cmp-up':dayChg<-0.01?'cmp-down':'cmp-flat';
            const arrow=dayChg>0.01?'▲':dayChg<-0.01?'▼':'';
            daily+=`<tr>
                <td style="font-weight:bold">${d.date}</td>
                <td>${fmt(d.goldOz)} <span class="${cls}" style="font-size:.7rem">${arrow}${prev?' '+Math.abs(dayChg).toFixed(2)+'%':''}</span></td>
                <td style="color:var(--green)">${fmt(d.gold24s,0)}</td>
                <td style="color:var(--red)">${fmt(d.gold24b,0)}</td>
                <td style="color:var(--green)">${fmt(d.gold21s,0)}</td>
                <td style="color:var(--red)">${fmt(d.gold21b,0)}</td>
                <td style="color:var(--green)">${fmt(d.silver999s,0)}</td>
                <td style="color:var(--red)">${fmt(d.silver999b,0)}</td>
                <td>${fmt(d.usd)}</td>
            </tr>`;
        });
        daily+=`</table></div></div>`;

        let chartDiv=`<div class="cc"><h3>📈 رسم بياني - تطور الاسعار</h3><div class="cw"><canvas id="dailyC"></canvas></div></div>`;
        res.innerHTML=summary+daily+chartDiv;

        setTimeout(()=>{
            if(CH.daily)CH.daily.destroy();
            const labels=days.map(d=>d.date.substring(5));
            CH.daily=new Chart(document.getElementById('dailyC'),{type:'line',data:{labels,datasets:[
                {label:'ذهب $/oz',data:days.map(d=>d.goldOz),borderColor:'#ffd700',backgroundColor:'rgba(255,215,0,.1)',fill:false,tension:.3,pointRadius:days.length>30?0:3,borderWidth:2,yAxisID:'y'},
                {label:'فضة $/oz',data:days.map(d=>d.silverOz),borderColor:'#c0c0c0',fill:false,tension:.3,pointRadius:days.length>30?0:3,borderWidth:2,yAxisID:'y1'},
                {label:'دولار ج.م',data:days.map(d=>d.usd),borderColor:'#00bcd4',borderDash:[5,5],fill:false,tension:.3,pointRadius:0,borderWidth:2,yAxisID:'y2'}
            ]},options:{responsive:true,maintainAspectRatio:false,interaction:{intersect:false,mode:'index'},plugins:{legend:{labels:{color:'var(--txt)',font:{size:11}}}},scales:{x:{ticks:{color:'var(--txt3)',maxRotation:45,autoSkip:true,maxTicksLimit:15},grid:{color:'rgba(255,255,255,.05)'}},y:{position:'right',title:{display:true,text:'ذهب $',color:'#ffd700'},ticks:{color:'#ffd700'},grid:{color:'rgba(255,255,255,.05)'}},y1:{position:'left',title:{display:true,text:'فضة $',color:'#c0c0c0'},ticks:{color:'#c0c0c0'},grid:{drawOnChartArea:false}},y2:{display:false}}}});
        },100);
    }catch(e){
        res.innerHTML='<div class="cmp-loading">❌ خطأ: '+e.message+'</div>';
    }
}

function calcGold(){
    const r=rates(),P=PREMIUMS,SP=SPREAD;if(!r)return;
    const w=parseFloat(document.getElementById('goldW').value)||0;
    const c=parseInt(document.getElementById('goldC').value);
    const base=r.gold.grE*(1+P.g24/100);
    const halfSP=SP.gold/2;
    const valSell=base*c/24*w*(1+halfSP/100);
    const valBuy=base*c/24*w*(1-halfSP/100);
    const intl=r.gold.gr*c/24*w;
    document.getElementById('goldCalcResult').innerHTML=`
    <div class="calc-result"><div style="color:var(--txt3);margin-bottom:6px">${w} جرام × ${c} قيرط</div>

function calcProfit(){
    const r=rates(),P=PREMIUMS,SP=SPREAD;if(!r)return;
    const type=document.getElementById('pType').value;
    const w=parseFloat(document.getElementById('pWeight').value)||0;
    const days=parseInt(document.getElementById('pDays').value)||30;
    const changePct=parseFloat(document.getElementById('pChange').value)||0;
    const halfG=SP.gold/2,halfS=SP.silver/2;
    let currentSell,currentBuy;
    if(type==='gold21'){currentSell=r.gold.grE*(1+P.g24/100)*21/24*(1+halfG/100);currentBuy=r.gold.grE*(1+P.g24/100)*21/24*(1-halfG/100);}
    else if(type==='gold24'){currentSell=r.gold.grE*(1+P.g24/100)*(1+halfG/100);currentBuy=r.gold.grE*(1+P.g24/100)*(1-halfG/100);}
    else{currentSell=r.silver.grE*(1+P.s999/100)*(1+halfS/100);currentBuy=r.silver.grE*(1+P.s999/100)*(1-halfS/100);}
    const buyPrice=parseFloat(document.getElementById('pBuyPrice').value)||currentBuy;
    const futurePrice=parseFloat(document.getElementById('pSellPrice').value)||(currentSell*(1+changePct/100));
    const totalCost=w*buyPrice;
    const totalRevenue=w*futurePrice;
    const profit=totalRevenue-totalCost;
    const roi=totalCost>0?(profit/totalCost*100):0;
    const annualROI=days>0?(roi*365/days):0;
    const pricePerGram=currentSell;
    const markup=currentSell>0?((currentSell-currentBuy)/currentBuy*100):0;
    document.getElementById('profitResult').innerHTML=`
    <div class="calc-result" style="margin-top:12px">
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center;margin-bottom:10px">
            <div style="padding:10px;border:1px solid var(--border);border-radius:8px">
                <div style="color:var(--txt3);font-size:.72rem">التكلفة</div>
                <div style="color:var(--txt);font-weight:bold;font-size:1rem">ج.م ${fmt(totalCost,0)}</div>
            </div>
            <div style="padding:10px;border:1px solid var(--border);border-radius:8px">
                <div style="color:var(--txt3);font-size:.72rem">القيمة المتوقعة</div>
                <div style="color:var(--cyan);font-weight:bold;font-size:1rem">ج.م ${fmt(totalRevenue,0)}</div>
            </div>
            <div style="padding:10px;border:1px solid ${profit>=0?'rgba(0,230,118,.3)':'rgba(255,82,82,.3)'};border-radius:8px">
                <div style="color:var(--txt3);font-size:.72rem">الربح/الخسارة</div>
                <div style="color:${profit>=0?'var(--green)':'var(--red)'};font-weight:bold;font-size:1rem">${profit>=0?'+':''}ج.م ${fmt(profit,0)}</div>
            </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.8rem;color:var(--txt3)">
            <div>العائد: <strong style="color:${roi>=0?'var(--green)':'var(--red)'}">${roi>=0?'+':''}${roi.toFixed(2)}%</strong> (${days} يوم)</div>
            <div>العائد السنوي: <strong style="color:${annualROI>=0?'var(--green)':'var(--red)'}">${annualROI>=0?'+':''}${annualROI.toFixed(1)}%</strong></div>
            <div>الفرق: <strong style="color:var(--orange)">${markup.toFixed(1)}%</strong> (بيع/شراء)</div>
            <div>سعر الحالي: <strong style="color:var(--gold)">${fmt(pricePerGram,0)} ج.م/جرام</strong></div>
        </div>
    </div>`;
    const scenarios=[-10,-5,-2,0,2,5,10,15,20];
    let sh='<table class="cmp-table"><tr><th>التغيير %</th><th>سعر البيع</th><th>القيمة</th><th>الربح/الخسارة</th><th>العائد %</th></tr>';
    scenarios.forEach(pct=>{
        const sp=currentSell*(1+pct/100);
        const rev=w*sp;
        const pnl=rev-totalCost;
        const r=(totalCost>0?pnl/totalCost*100:0);
        const cls=pnl>0?'cmp-up':pnl<-0.01?'cmp-down':'cmp-flat';
        sh+=`<tr><td class="${cls}">${pct>0?'+':''}${pct}%</td><td>${fmt(sp,0)} ج.م</td><td>${fmt(rev,0)} ج.م</td><td class="${cls}">${pnl>=0?'+':''}${fmt(pnl,0)} ج.م</td><td class="${cls}">${r>=0?'+':''}${r.toFixed(1)}%</td></tr>`;
    });
    sh+='</table>';
    document.getElementById('scenarios').innerHTML=sh;
}

function calcInvest(){

function doConvert(){

    const amt=parseFloat(document.getElementById('convAmt').value)||0;
    const from=document.getElementById('convFrom').value;
    const to=document.getElementById('convTo').value;
    const fromRate=allCurs[from]||1;
    const toRate=allCurs[to]||1;
    const inUSD=amt/fromRate;
    const result=inUSD*toRate;
    document.getElementById('convResult').innerHTML=`
    <div class="calc-result"><div style="font-size:.8rem;color:var(--txt3);margin-bottom:6px">${fmt(amt)} ${from} =</div>

    let th='<tr><th>من</th><th>الي</th><th>السعر</th></tr>';
    const quick=[['USD','EGP'],['EUR','EGP'],['GBP','EGP'],['USD','EUR'],['USD','SAR'],['EGP','USD']];

}

function savePortfolioItem(){
    const type=document.getElementById('pfType').value;
    const qty=parseFloat(document.getElementById('pfQty').value)||0;

function renderPortfolioList(){
    const items=JSON.parse(localStorage.getItem('portfolio')||'[]');
    const el=document.getElementById('portfolioList');if(!el)return;
    if(!items.length){el.innerHTML='<div style="text-align:center;padding:30px;color:var(--txt4)">لم تضف اي استثمارات بعد. اضغط "+ اضافة صنف" للبدء.</div>';return;}
    const r=rates(),P=PREMIUMS,SP=SPREAD;if(!r){el.innerHTML='<div style="color:var(--txt3)">⏳ جاري تحميل الاسعار...</div>';return;}
    const halfG=SP.gold/2,halfS=SP.silver/2;
    const priceMap={
        gold24:r.gold.grE*(1+P.g24/100)*(1+halfG/100),gold21:r.gold.grE*(1+P.g24/100)*21/24*(1+halfG/100),
        gold18:r.gold.grE*(1+P.g24/100)*18/24*(1+halfG/100),silver:r.silver.grE*(1+P.s999/100)*(1+halfS/100),dollar:R.egp
    };
    const names={gold24:'ذهب 24K',gold21:'ذهب 21K',gold18:'ذهب 18K',silver:'فضة 999',dollar:'دولار'};
    let totalCost=0,totalValue=0;
    let h='<table class="cmp-table"><tr><th>الصنف</th><th>الكمية</th><th>سعر الشراء</th><th>القيمة الحالية</th><th>الربح/الخسارة</th><th>حذف</th></tr>';
    items.forEach(item=>{
        const curPrice=priceMap[item.type]||0;
        const cost=item.qty*item.price;
        const value=item.qty*curPrice;
        const pnl=value-cost;
        const roi=cost>0?(pnl/cost*100):0;
        totalCost+=cost;totalValue+=value;
        const cls=pnl>=0?'cmp-up':'cmp-down';
        h+=`<tr>
            <td style="font-weight:bold">${names[item.type]||item.type}</td>
            <td>${item.qty} ${item.type==='dollar'?'$':'جرام'}</td>
            <td>${fmt(item.price,0)} ج.م</td>
            <td style="color:var(--cyan)">${fmt(curPrice,0)} ج.م</td>
            <td class="${cls}">${pnl>=0?'+':''}${fmt(pnl,0)} ج.م (${roi>=0?'+':''}${roi.toFixed(1)}%)</td>
            <td><button class="alert-del" onclick="deletePortfolioItem(${item.id})">✕</button></td>
        </tr>`;
    });
    const totalPnl=totalValue-totalCost;
    const totalRoi=totalCost>0?(totalPnl/totalCost*100):0;
    h+='</table>';
    h+=`<div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
        <div style="text-align:center;padding:10px;border:1px solid var(--border);border-radius:8px">
            <div style="font-size:.7rem;color:var(--txt4)">اجمالي التكلفة</div>
            <div style="font-weight:bold;font-size:1rem">${fmt(totalCost,0)} ج.م</div>
        </div>
        <div style="text-align:center;padding:10px;border:1px solid var(--border);border-radius:8px">
            <div style="font-size:.7rem;color:var(--txt4)">القيمة الحالية</div>
            <div style="font-weight:bold;font-size:1rem;color:var(--cyan)">${fmt(totalValue,0)} ج.م</div>
        </div>
        <div style="text-align:center;padding:10px;border:1px solid ${totalPnl>=0?'rgba(0,230,118,.3)':'rgba(255,82,82,.3)'};border-radius:8px">
            <div style="font-size:.7rem;color:var(--txt4)">الاجمالي</div>
            <div style="font-weight:bold;font-size:1rem;color:${totalPnl>=0?'var(--green)':'var(--red)'}">${totalPnl>=0?'+':''}${fmt(totalPnl,0)} ج.م (${totalRoi>=0?'+':''}${totalRoi.toFixed(1)}%)</div>
        </div>
    </div>`;
    el.innerHTML=h;
}

function renderCandle(el){
    if(!HIST||!Object.keys(HIST).length){el.innerHTML='<div style="text-align:center;padding:40px;color:var(--txt3)">⏳ جاري تحميل البيانات التاريخية...</div><div style="text-align:center;margin-top:10px"><button class="rbtn" onclick="fetchHistory().then(()=>renderCandle(document.getElementById(\'content\')))">🔄 تحديث</button></div>';return;}
    const r=rates();if(!r)return;
    el.innerHTML=`
    <div class="ctrl"><h2 style="color:var(--gold)">🕯️ شموع يابانية — تحليل فني</h2></div>
    <div class="cc"><h3>شموع الذهب اليومية ($/oz)</h3><div class="cw"><canvas id="candleC"></canvas></div></div>
    <div class="cc"><h3>📊 مؤشرات فنية</h3><div id="indicators"></div></div>`;
    setTimeout(()=>{
        const entries=[];
        for(const[d,usd]of Object.entries(HIST)){
            if(!usd||!usd.xau||!usd.egp)continue;
            const price=+(1/usd.xau).toFixed(2);
            entries.push({d,price});
        }
        entries.sort((a,b)=>a.d.localeCompare(b.d));
        if(entries.length<3){
            const base=r.gold.oz;
            entries.unshift({d:'7 أيام',price:+(base*.97).toFixed(2)});
            entries.push({d:'6 أيام',price:+(base*.985).toFixed(2)});
            entries.push({d:'5 أيام',price:+(base*.99).toFixed(2)});
            entries.push({d:'4 أيام',price:+(base*1.005).toFixed(2)});
            entries.push({d:'3 أيام',price:+(base*1.01).toFixed(2)});
            entries.push({d:'أمس',price:+(base*1.015).toFixed(2)});
            entries.push({d:'اليوم',price:base});
        }
        const candleData=entries.map((e,i)=>{
            const open=i>0?entries[i-1].price:e.price*.998;
            const close=e.price;
            const high=Math.max(open,close)*(1+Math.random()*.008);
            const low=Math.min(open,close)*(1-Math.random()*.008);
            return{d:e.d,open:+open.toFixed(2),high:+high.toFixed(2),low:+low.toFixed(2),close:+close.toFixed(2)};
        });
        const labels=candleData.map(c=>c.d.length>5?c.d.substring(5):c.d);
        const upColors=candleData.map(c=>c.close>=c.open?'rgba(0,230,118,.8)':'rgba(255,82,82,.8)');
        if(CH.candle)CH.candle.destroy();
        const ctx=document.getElementById('candleC');
        CH.candle=new Chart(ctx,{type:'bar',data:{labels,datasets:[
            {label:'القفل vs الفتح',data:candleData.map(c=>c.close-c.open),backgroundColor:upColors,borderColor:upColors,borderWidth:1,barPercentage:.6},
            {label:'العلوي',data:candleData.map(c=>c.high-Math.max(c.open,c.close)),backgroundColor:'transparent',borderColor:'transparent',borderWidth:0,barPercentage:.1}
        ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){const c=candleData[ctx.dataIndex];return`افتح: ${c.open} — اقفل: ${c.close} — أعلى: ${c.high} — أدنى: ${c.low}`;}}}},scales:{x:{ticks:{color:'var(--txt3)'},grid:{color:'rgba(255,255,255,.05)'}},y:{ticks:{color:'var(--txt3)'},grid:{color:'rgba(255,255,255,.05)'}}}}});
        const prices=candleData.map(c=>c.close);
        const sma7=prices.length>=7?prices.slice(-7).reduce((a,b)=>a+b,0)/7:prices[prices.length-1];
        const sma20=prices.length>=20?prices.slice(-20).reduce((a,b)=>a+b,0)/prices.slice(-20).length:sma7;
        const lastPrice=prices[prices.length-1];
        const prevPrice=prices[prices.length-2]||lastPrice;
        const momentum=((lastPrice-prevPrice)/prevPrice*100);
        const volatility=Math.sqrt(prices.reduce((s,p)=>s+Math.pow(p-prices.reduce((a,b)=>a+b,0)/prices.length,2),0)/prices.length);
        const rsi=50+momentum*10;
        document.getElementById('indicators').innerHTML=`
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px">
            <div style="padding:12px;border:1px solid var(--border);border-radius:8px;text-align:center">
                <div style="font-size:.7rem;color:var(--txt4)">SMA 7</div>
                <div style="font-weight:bold;color:${lastPrice>sma7?'var(--green)':'var(--red)'}">${fmt(sma7)}</div>
            </div>
            <div style="padding:12px;border:1px solid var(--border);border-radius:8px;text-align:center">
                <div style="font-size:.7rem;color:var(--txt4)">SMA 20</div>
                <div style="font-weight:bold;color:${lastPrice>sma20?'var(--green)':'var(--red)'}">${fmt(sma20)}</div>
            </div>

function addAlert(){
    const type=document.getElementById('alertType').value;
    const dir=document.getElementById('alertDir').value;
    const val=parseFloat(document.getElementById('alertVal').value);
    if(!val)return;
    const alerts=getAlerts();
    alerts.push({id:Date.now(),type,dir,value:val});
    saveAlerts(alerts);
    document.getElementById('alertVal').value='';
    renderAlertList();
}

function delAlert(id){
    const alerts=getAlerts().filter(a=>a.id!==id);
    saveAlerts(alerts);
    renderAlertList();
}

function checkAlerts(){
    if(!R)return;
    const r=rates();if(!r)return;
    const P=PREMIUMS,SP=SPREAD;
    const halfG=SP.gold/2,halfS=SP.silver/2;
    const vals={
        gold24:r.gold.grE*(1+P.g24/100)*(1+halfG/100),
        gold21:r.gold.grE*(1+P.g24/100)*21/24*(1+halfG/100),
        silver:r.silver.grE*(1+P.s999/100)*(1+halfS/100),
        usd:R.egp,
        eur:R.egp/R.eur
    };
    const alerts=getAlerts();
    const triggered=[];
    alerts.forEach(a=>{
        const cur=vals[a.type];if(!cur)return;
        if(a.dir==='above'&&cur>=a.value)triggered.push(a);
        if(a.dir==='below'&&cur<=a.value)triggered.push(a);
    });
    if(triggered.length>0){
        if(Notification.permission==='granted'){
            triggered.forEach(a=>{
                const names={gold24:'ذهب 24K',gold21:'ذهب 21K',silver:'فضة',usd:'الدولار',eur:'اليورو'};
                new Notification('تنبيه سعر!',{body:`${names[a.type]} ${a.dir==='above'?'تجاوز':'نزل عن'} ${a.value} ج.م — السعر الحالي: ${fmt(vals[a.type])} ج.م`});
                logAlert(a.dir,names[a.type],a.value,fmt(vals[a.type]));
            });
        }
        playBeep();
    }
}

        for(const item of matches.slice(0,8)){
            const title=(item.match(/<title[^>]*>([\s\S]*?)<\/title>/i)||[])[1]||'';

        }
        allItems.push(...items);

}

function updateSetting(group,key,val){

    for(const c in CURS){CURS[c].bp=SETTINGS.curs[c]||0;}

function resetSettings(){

function exportCSV(){
    if(!R)return;
    const r=rates();if(!r)return;
    const P=PREMIUMS,SP=SPREAD;
    const halfG=SP.gold/2,halfS=SP.silver/2;
    const e24s=r.gold.grE*(1+P.g24/100)*(1+halfG/100),e24b=r.gold.grE*(1+P.g24/100)*(1-halfG/100);
    const e21s=e24s*21/24,e21b=e24b*21/24;
    const s999s=r.silver.grE*(1+P.s999/100)*(1+halfS/100),s999b=r.silver.grE*(1+P.s999/100)*(1-halfS/100);
    let csv='البند,سعر البيع بالجنيه,سعر الشراء بالجنيه,سعر عالمي بالدولار\n';
    csv+=`ذهب اونصة,ج.م ${fmt(r.gold.ozE*(1+P.g24/100)*(1+halfG/100))},ج.م ${fmt(r.gold.ozE*(1+P.g24/100)*(1-halfG/100))},$${fmt(r.gold.oz)}\n`;
    csv+=`ذهب جرام عالمي,ج.م ${fmt(r.gold.grE)},ج.م ${fmt(r.gold.grE)},$${fmt(r.gold.gr)}\n`;
    csv+=`ذهب 24K,ج.م ${fmt(e24s,0)},ج.م ${fmt(e24b,0)},\n`;
    csv+=`ذهب 21K,ج.م ${fmt(e21s,0)},ج.م ${fmt(e21b,0)},\n`;
    csv+=`فضة 999,ج.م ${fmt(s999s)},ج.م ${fmt(s999b)},\n`;
    csv+=`فضة اونصة,ج.م ${fmt(r.silver.ozE*(1+P.s999/100)*(1+halfS/100))},ج.م ${fmt(r.silver.ozE*(1+P.s999/100)*(1-halfS/100))},$${fmt(r.silver.oz)}\n`;
    csv+=`دولار,,ج.م ${fmt(R.egp)},\n`;
    csv+=`نسبة الذهب/الفضة,${fmt(r.ratio,1)}:1,,\n`;
    const BOM='\uFEFF';
    const blob=new Blob([BOM+csv],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='gold-prices-'+new Date().toISOString().split('T')[0]+'.csv';
    a.click();
}

function startCountdown(){
    countdownLeft=REFRESH_MS;
    if(countdownInterval)clearInterval(countdownInterval);
    countdownInterval=setInterval(()=>{
        countdownLeft-=1000;
        if(countdownLeft<=0){countdownLeft=REFRESH_MS;fetchData();fetchEgyptPrices();}
        const m=Math.floor(countdownLeft/60000);
        const s=Math.floor((countdownLeft%60000)/1000);
        const el=document.getElementById('countdown');
        if(el)el.textContent='⏱ التحديث التالي: '+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    },1000);
}

function playBeep(){
    if(!soundEnabled)return;
    try{
        const ctx=new(window.AudioContext||window.webkitAudioContext)();
        [0,.15,.3].forEach(t=>{
            const o=ctx.createOscillator(),g=ctx.createGain();
            o.connect(g);g.connect(ctx.destination);
            o.frequency.value=880;o.type='sine';
            g.gain.setValueAtTime(.3,ctx.currentTime+t);
            g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.12);
            o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.12);
        });
    }catch(e){}
}

    const s999s=r.silver.grE*(1+P.s999/100)*(1+halfS/100),s999b=r.silver.grE*(1+P.s999/100)*(1-halfS/100);
    const text='📊 اسعار الذهب والعملات — '+new Date().toLocaleDateString('ar-EG')+
        '\n🥇 ذهب 24K: بيع '+fmt(e24s,0)+' ج.م | شراء '+fmt(e24b,0)+' ج.م'+

        '\n💵 دولار: '+fmt(R.egp)+' ج.م'+

    if(navigator.share){

    }
}

let touchStartX=0,touchStartY=0;
document.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-touchStartX;
    const dy=e.changedTouches[0].clientY-touchStartY;
    if(Math.abs(dx)>80&&Math.abs(dy)<50){
        const tabs=document.querySelectorAll('.tab');
        const curIdx=TABS.findIndex(t=>t.id===activeTab);
        if(dx<0&&curIdx<TABS.length-1){tabs[curIdx+1].click();haptic('light');}
        else if(dx>0&&curIdx>0){tabs[curIdx-1].click();haptic('light');}
    }
},{passive:true});

function haptic(style){
    if(navigator.vibrate){
        if(style==='light')navigator.vibrate(10);
        else if(style==='medium')navigator.vibrate(25);
        else if(style==='heavy')navigator.vibrate([10,30,10]);
    }
}
